<div class="container mx-auto p-4 flex flex-col gap-4">
  <p-card class="w-full image-annotator-card" [style]="{ height: '33rem' }">
    <ng-template pTemplate="header"> Image Annotator </ng-template>
    <ng-template pTemplate="content">
      <div class="image-display-area">
        <div
          *ngIf="!hasImage"
          class="upload-placeholder flex flex-col items-center justify-center h-full border-2 border-dashed rounded-lg transition-colors cursor-pointer p-5"
          (click)="triggerFileInput()"
        >
          <i class="pi pi-cloud-upload text-6xl upload-icon mb-4"></i>
          <p class="upload-text">Drop your image here or click to upload</p>
          <p class="upload-hint text-sm mt-2">
            Supports common image formats (JPG, PNG, etc.)
          </p>
        </div>

        <div
          *ngIf="hasImage"
          [ngClass]="{ 'drawing-mode': isDrawingEnabled }"
          class="canvas-wrapper"
        >
          <canvas #canvas (click)="handleCanvasClick($event)">
            Your browser does not support the canvas element.
          </canvas>
        </div>
      </div>
    </ng-template>
  </p-card>

  <p-card class="w-full tools-card">
    <ng-template pTemplate="header"> Tools </ng-template>
    <ng-template pTemplate="content">
      <div class="tools-container p-3 rounded-lg">
        <div
          class="flex flex-wrap gap-x-4 gap-y-2 items-center justify-start md:justify-between"
        >
          <div class="flex items-center gap-2 flex-wrap justify-center">
            <p-button
              [label]="isDrawingEnabled ? 'Drawing Active' : 'Enable Draw'"
              [icon]="isDrawingEnabled ? 'pi pi-pencil' : 'pi pi-pencil'"
              [outlined]="!isDrawingEnabled"
              [severity]="isDrawingEnabled ? 'success' : 'secondary'"
              (onClick)="toggleDrawing()"
              [disabled]="!hasImage"
              pTooltip="Toggle drawing mode"
              tooltipPosition="top"
              styleClass="p-button-sm"
            ></p-button>
            <p-divider layout="vertical" styleClass="h-2"></p-divider>
            <p-button
              label="Complete"
              icon="pi pi-check-circle"
              severity="success"
              [outlined]="true"
              [disabled]="!canCompletePolygon"
              (onClick)="completeCurrentPolygon()"
              pTooltip="Finish the current polygon (needs >= 3 points)"
              tooltipPosition="top"
              styleClass="p-button-sm"
            ></p-button>
            <p-divider layout="vertical" styleClass="h-2"></p-divider>
            <p-button
              label="Clear All"
              icon="pi pi-times-circle"
              severity="warn"
              [outlined]="true"
              [disabled]="!hasPolygons"
              (onClick)="deleteAllPolygons()"
              pTooltip="Remove all polygons"
              tooltipPosition="top"
              styleClass="p-button-sm"
            ></p-button>
            <p-divider layout="vertical" styleClass="h-2"></p-divider>

            <input
              #fileInput
              type="file"
              accept="image/*"
              (change)="uploadImage($event)"
              class="hidden"
            />
            <p-button
              label="Upload New"
              icon="pi pi-upload"
              severity="info"
              [outlined]="true"
              (onClick)="triggerFileInput()"
              pTooltip="Upload a new image (clears current)"
              tooltipPosition="top"
              styleClass="p-button-sm"
            ></p-button>
            <p-divider layout="vertical" styleClass="h-2"></p-divider>
            <p-button
              label="Undo"
              icon="pi pi-undo"
              [outlined]="true"
              [disabled]="!isUndoable"
              (onClick)="undo()"
              pTooltip="Undo last action"
              tooltipPosition="top"
              styleClass="p-button-sm p-button-secondary"
            ></p-button>
            <p-divider layout="vertical" styleClass="h-2"></p-divider>
            <p-button
              label="Redo"
              icon="pi pi-refresh"
              [outlined]="true"
              [disabled]="!isRedoable"
              (onClick)="redo()"
              pTooltip="Redo last undone action"
              tooltipPosition="top"
              styleClass="p-button-sm p-button-secondary"
            ></p-button>
            <p-divider layout="vertical" styleClass="h-2"></p-divider>

            <p-button
              label="Reset All"
              icon="pi pi-trash"
              severity="danger"
              [outlined]="true"
              (onClick)="reset()"
              pTooltip="Clear image and all annotations"
              tooltipPosition="top"
              styleClass="p-button-sm"
            ></p-button>
          </div>
        </div>
      </div>
    </ng-template>
  </p-card>
</div>
